    - task: DownloadPipelineArtifact@2
      displayName: Download Build Artifact
      inputs:
        buildType: 'specific'
        project: 'e161fa95-0015-4b95-8e1b-439d8e5ff69e'
        definition: '12'
        buildVersionToDownload: 'specific'
        pipelineId: '172'
        artifactName: 'todo-frontend-ui'
        targetPath: '$(System.DefaultWorkingDirectory)/build_artifacts'

    # - task: DownloadPipelineArtifact@2
    #   displayName: Download Build Artifact
    #   inputs:
    #     buildType: 'current'
    #     artifactName: 'todo-frontend-ui'
    #     targetPath: '$(System.DefaultWorkingDirectory)/build_artifacts'

    - task: CopyFilesOverSSH@0
      inputs:
        sshEndpoint: 'ssh serv conn- frontend vm'
        sourceFolder: '$(System.DefaultWorkingDirectory)/build_artifacts/'
        contents: '**'
        cleanTargetFolder: true
        targetFolder: '/home/ashuvm'
        readyTimeout: '20000'

    - task: SSH@0
      inputs:
        sshEndpoint: 'ssh serv conn- frontend vm'
        runOptions: 'inline'
        inline: |
          sudo apt update
          sudo apt install nginx
          sudo rm -r /var/www/html
          sudo cp -r /home/ashuvm/* /var/www/html
        readyTimeout: '20000'

    

